<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="#0ea5e9"/>

  <!-- Motorcycle body -->
  <!-- Engine -->
  <circle cx="220" cy="280" r="55" fill="#1e293b" stroke="#0f172a" stroke-width="6"/>

  <!-- Wheels -->
  <circle cx="140" cy="390" r="72" fill="none" stroke="#1e293b" stroke-width="22"/>
  <circle cx="140" cy="390" r="40" fill="#0f172a"/>
  <circle cx="140" cy="390" r="10" fill="#94a3b8"/>

  <circle cx="352" cy="390" r="72" fill="none" stroke="#1e293b" stroke-width="22"/>
  <circle cx="352" cy="390" r="40" fill="#0f172a"/>
  <circle cx="352" cy="390" r="10" fill="#94a3b8"/>

  <!-- Frame -->
  <line x1="170" y1="330" x2="220" y2="250" stroke="#1e293b" stroke-width="14" stroke-linecap="round"/>
  <line x1="280" y1="230" x2="340" y2="330" stroke="#1e293b" stroke-width="14" stroke-linecap="round"/>
  <line x1="220" y1="280" x2="280" y2="230" stroke="#1e293b" stroke-width="12" stroke-linecap="round"/>

  <!-- Fork -->
  <line x1="352" y1="330" x2="370" y2="270" stroke="#1e293b" stroke-width="10" stroke-linecap="round"/>

  <!-- Handlebars -->
  <line x1="370" y1="270" x2="360" y2="240" stroke="#0f172a" stroke-width="8" stroke-linecap="round"/>
  <line x1="360" y1="240" x2="340" y2="240" stroke="#0f172a" stroke-width="8" stroke-linecap="round"/>

  <!-- Seat -->
  <path d="M 210 240 Q 230 225 260 230 L 285 220 Q 300 215 310 230" fill="#0f172a" stroke="#0f172a" stroke-width="5"/>

  <!-- Headlight -->
  <circle cx="380" cy="260" r="12" fill="#fbbf24" stroke="#eab308" stroke-width="3"/>

  <!-- Exhaust -->
  <line x1="170" y1="300" x2="120" y2="290" stroke="#475569" stroke-width="8" stroke-linecap="round"/>

  <!-- Text -->
  <text x="256" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="white">PM</text>
</svg>
